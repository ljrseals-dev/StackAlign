[stackalign-honeytrap]
enabled = false
# Explicit opt-in only: enable after recording admin/proxy allowlist and testing recovery.
filter = stackalign-honeytrap
backend = systemd
journalmatch = SYSLOG_IDENTIFIER=stackalign-honeytrap
maxretry = 1
findtime = 600
bantime = 86400
