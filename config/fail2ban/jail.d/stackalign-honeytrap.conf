[stackalign-honeytrap]
enabled = true
# Active by default. Configure exact administrator/proxy exclusions and verify
# console recovery before exposing the host.
filter = stackalign-honeytrap
backend = systemd
journalmatch = SYSLOG_IDENTIFIER=stackalign-honeytrap
maxretry = 1
findtime = 600
bantime = 86400
