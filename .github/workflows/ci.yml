# Historical CI evidence is revision-specific and is not real-host acceptance.
name: ci
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck gnupg openssh-server openssh-client openssl
      - run: make security
      - run: make lint
      - run: make headers
      - run: make test

  almalinux9:
    # EL9 userland regression coverage; not a real-host deployment test.
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install test dependencies
        run: dnf install -y bash python3 tar gzip gawk diffutils findutils make git gnupg2 openssh-server openssh-clients openssl
      - uses: actions/checkout@v6
      - run: make security
      - run: make lint
      - run: make headers
      - name: Run fixture tests as unprivileged user
        run: |
          chown -R nobody:nobody "$GITHUB_WORKSPACE"
          su -s /bin/bash nobody -c "cd '$GITHUB_WORKSPACE' && make test"

  centos_stream9:
    # CentOS Stream 9 compatibility coverage; not a real-host deployment test.
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - name: Install test dependencies
        run: dnf install -y bash python3 tar gzip gawk diffutils findutils make git gnupg2 openssh-server openssh-clients openssl
      - uses: actions/checkout@v6
      - run: make security
      - run: make lint
      - run: make headers
      - name: Run fixture tests as unprivileged user
        run: |
          chown -R nobody:nobody "$GITHUB_WORKSPACE"
          su -s /bin/bash nobody -c "cd '$GITHUB_WORKSPACE' && make test"
