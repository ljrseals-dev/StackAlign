# CI checks are revision-specific and are not real-host deployment acceptance.
name: ci
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck gnupg openssh-server openssh-client openssl sqlite3
      - name: Run security, lint, headers, and tests
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'commit=%s\nrun_id=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB"
            make security
            make lint
            make headers
            make test
          } 2>&1 | tee stackalign-ci-evidence.log
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackalign-ci-${{ github.job }}-${{ github.sha }}
          path: stackalign-ci-evidence.log
          if-no-files-found: warn

  almalinux9:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install test dependencies
        run: dnf install -y bash python3 tar gzip gawk diffutils findutils make git gnupg2 openssh-server openssh-clients openssl sqlite
      - uses: actions/checkout@v6
      - name: Run security, lint, headers, and tests
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'commit=%s\nrun_id=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB"
            make security
            make lint
            make headers
            chown -R nobody:nobody "$GITHUB_WORKSPACE"
            su -s /bin/bash nobody -c "cd '$GITHUB_WORKSPACE' && make test"
          } 2>&1 | tee stackalign-ci-evidence.log
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackalign-ci-${{ github.job }}-${{ github.sha }}
          path: stackalign-ci-evidence.log
          if-no-files-found: warn

  centos_stream9:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
      - name: Install test dependencies
        run: dnf install -y bash python3 tar gzip gawk diffutils findutils make git gnupg2 openssh-server openssh-clients openssl sqlite
      - uses: actions/checkout@v6
      - name: Run security, lint, headers, and tests
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'commit=%s\nrun_id=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB"
            make security
            make lint
            make headers
            chown -R nobody:nobody "$GITHUB_WORKSPACE"
            su -s /bin/bash nobody -c "cd '$GITHUB_WORKSPACE' && make test"
          } 2>&1 | tee stackalign-ci-evidence.log
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackalign-ci-${{ github.job }}-${{ github.sha }}
          path: stackalign-ci-evidence.log
          if-no-files-found: warn
