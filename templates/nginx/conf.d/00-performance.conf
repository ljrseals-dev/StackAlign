# Include from nginx.conf inside the http {} context.
# FastCGI cache is opt-in at the site/location level.

fastcgi_cache_path /var/cache/nginx/fastcgi
    levels=1:2
    keys_zone=stackalign_cache:100m
    inactive=60m
    max_size=10g
    use_temp_path=off;

map $http_user_agent $sa_is_ai_crawler {
    default                 0;
    ~*claudebot             1;
    ~*claude-searchbot      1;
    ~*gptbot                1;
    ~*oai-searchbot         1;
    ~*perplexitybot         1;
    ~*claude-user          1;
    ~*chatgpt-user        1;
    ~*anthropic-ai        1;
    ~*ccbot               1;
    ~*bytespider          1;
}

# The map is deliberately conservative: applications may add their own
# session-cookie names through a separately reviewed site policy.
map $http_cookie $sa_has_auth_cookie {
    default 0;
    ~*(comment_author|wordpress_|wp-|logged_in|PHPSESSID|laravel_session) 1;
}
